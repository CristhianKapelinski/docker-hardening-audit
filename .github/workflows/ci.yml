# CI: testes e reprodução offline. Nada aqui precisa de rede, de docker ou de
# dataset grande, então o pipeline é a prova de que o artefato funciona numa
# máquina que não é a do autor. Localmente, ./scripts/verify_all.sh executa
# exatamente os mesmos passos, em menos de um segundo.
name: ci

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    container: python:3.12-slim@sha256:af4e85f1cac90dd3771e47292ea7c8a9830abfabbe4faa5c53f158854c2e819d
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --no-cache-dir --quiet '.[dev]'
      - run: python -m pytest tests/ -q

  teste-minimo:
    needs: testes
    runs-on: ubuntu-latest
    container: python:3.12-slim@sha256:af4e85f1cac90dd3771e47292ea7c8a9830abfabbe4faa5c53f158854c2e819d
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/minimal_test.sh

  reivindicacao-1:
    needs: testes
    runs-on: ubuntu-latest
    container: python:3.12-slim@sha256:af4e85f1cac90dd3771e47292ea7c8a9830abfabbe4faa5c53f158854c2e819d
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/reproduce.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: values
          path: expected/values.json
          retention-days: 30
