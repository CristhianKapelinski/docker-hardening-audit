# CI: testes e reprodução offline em cada push. Nada aqui precisa de rede, de
# docker ou de dataset grande, então o pipeline é a prova contínua de que o
# artefato funciona numa máquina que não é a do autor.
stages: [test, reproduce]

default:
  image: python:3.12-slim@sha256:af4e85f1cac90dd3771e47292ea7c8a9830abfabbe4faa5c53f158854c2e819d
  interruptible: true

testes:
  stage: test
  script:
    - python -m pip install --no-cache-dir --quiet '.[dev]'
    - python -m pytest tests/ -q

teste-minimo:
  stage: reproduce
  script:
    - bash scripts/minimal_test.sh

reivindicacao-1:
  stage: reproduce
  script:
    - bash scripts/reproduce.sh
  artifacts:
    when: always
    expire_in: 30 days
    paths: [expected/values.json]
