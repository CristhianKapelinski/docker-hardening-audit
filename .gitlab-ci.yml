# CI: testes e reprodução offline. Nada aqui precisa de rede, de docker ou de
# dataset grande, então o pipeline é a prova de que o artefato funciona numa
# máquina que não é a do autor.
#
# O pipeline só é criado quando a variável DHAUDIT_CI vale "true". A razão está
# registrada: na conta em que este repositório está publicado, o GitLab responde
# "Identity verification is required in order to run CI jobs" (confirmado pelo
# lint oficial em modo dry_run), e uma conta gratuita sem verificação de
# identidade cria o pipeline e o falha sem executar job nenhum. Um pipeline
# vermelho que nunca rodou é pior evidência do que nenhum. Quem tiver conta
# verificada define DHAUDIT_CI=true nas variáveis do projeto e o pipeline roda;
# localmente, ./scripts/verify_all.sh executa exatamente os mesmos passos.
workflow:
  rules:
    - if: $DHAUDIT_CI == "true"

stages: [test, reproduce]

default:
  image: python:3.12-slim@sha256:af4e85f1cac90dd3771e47292ea7c8a9830abfabbe4faa5c53f158854c2e819d
  interruptible: true

testes:
  stage: test
  script:
    - python -m pip install --no-cache-dir --quiet '.[dev]'
    - python -m pytest tests/ -q

teste-minimo:
  stage: reproduce
  script:
    - bash scripts/minimal_test.sh

reivindicacao-1:
  stage: reproduce
  script:
    - bash scripts/reproduce.sh
  artifacts:
    when: always
    expire_in: 30 days
    paths: [expected/values.json]
